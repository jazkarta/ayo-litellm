# Religious bias and discrimination detection
# Uses conditional logic: BLOCK if an identifier word + block word appear in same sentence
category_name: "bias_religious"
description: "Detects religious discrimination, stereotypes, and biased content using identifier + block word combinations"
default_action: "BLOCK"

# IDENTIFIER WORDS - Religion names (never blocked alone)
identifier_words:
  - "muslim"
  - "muslims"
  - "islam"
  - "islamic"
  - "jew"
  - "jews"
  - "jewish"
  - "christian"
  - "christians"
  - "christianity"
  - "atheist"
  - "atheists"
  - "hindu"
  - "hindus"
  - "hinduism"
  - "buddhist"
  - "buddhists"
  - "buddhism"
  - "sikh"
  - "sikhs"
  - "sikhism"
  - "catholic"
  - "catholics"
  - "protestant"
  - "protestants"
  - "mormon"
  - "mormons"

# ADDITIONAL BLOCK WORDS - Harmful framing that triggers when combined with identifier words
additional_block_words:
  # Terrorism / violence associations
  - "terrorist"
  - "terrorists"
  - "terrorism"
  - "extremist"
  - "extremists"
  - "extremism"
  - "radical"
  - "radicals"
  - "radicalized"
  - "violent"
  - "violence"
  - "bomber"
  - "bombers"
  - "jihadist"
  - "jihadists"

  # Calls for bans / exclusion / deportation
  - "should be banned"
  - "must be banned"
  - "ban all"
  - "deport"
  - "deportation"
  - "remove"
  - "removal"
  - "eliminate"
  - "elimination"
  - "get rid of"
  - "don't belong"
  - "do not belong"
  - "not welcome"
  - "should be expelled"
  - "send them back"
  - "kick out"
  - "should leave"
  - "must leave"

  # Dehumanizing framing
  - "inferior"
  - "superior"
  - "subhuman"
  - "sub-human"
  - "barbaric"
  - "barbarian"
  - "savage"
  - "savages"
  - "primitive"
  - "backwards"
  - "uncivilized"
  - "evil"
  - "evil people"
  - "disgusting"
  - "filthy"
  - "dirty"

  # Threat / danger framing
  - "dangerous"
  - "threat"
  - "problem"
  - "plague"
  - "disease"
  - "infection"
  - "parasite"
  - "parasites"
  - "vermin"
  - "invading"
  - "invasion"
  - "invaders"
  - "taking over"
  - "replacing"
  - "infiltrating"
  - "infiltration"

  # Crime / negative stereotypes
  - "criminal"
  - "criminals"
  - "child abuser"
  - "child abusers"
  - "groomer"
  - "groomers"
  - "pedophile"
  - "pedophiles"
  - "corrupt"
  - "greedy"
  - "manipulative"
  - "liars"
  - "liar"
  - "untrustworthy"

  # Supremacy / hatred
  - "should be destroyed"
  - "must be destroyed"
  - "deserve to die"
  - "should be killed"
  - "need to die"
  - "should be wiped out"
  - "eradicate"
  - "exterminate"
  - "purge"

# ALWAYS BLOCK - Explicit religious hate speech
always_block_keywords:
  - keyword: "muslim terrorist"
    severity: "high"
  - keyword: "islamic terrorist"
    severity: "high"
  - keyword: "muslim extremist"
    severity: "high"
  - keyword: "islamic extremism is the problem"
    severity: "high"
  - keyword: "ban all muslims"
    severity: "high"
  - keyword: "deport all muslims"
    severity: "high"
  - keyword: "muslims are terrorists"
    severity: "high"
  - keyword: "muslims are dangerous"
    severity: "high"
  - keyword: "muslims are evil"
    severity: "high"
  - keyword: "islam is evil"
    severity: "high"
  - keyword: "islam is a cancer"
    severity: "high"
  - keyword: "islam is a disease"
    severity: "high"
  - keyword: "death to jews"
    severity: "high"
  - keyword: "jews control"
    severity: "high"
  - keyword: "jewish conspiracy"
    severity: "high"
  - keyword: "jewish elite"
    severity: "high"
  - keyword: "jews are evil"
    severity: "high"
  - keyword: "jews are greedy"
    severity: "high"
  - keyword: "jewish world domination"
    severity: "high"
  - keyword: "jewish globalists"
    severity: "high"
  - keyword: "christians are evil"
    severity: "high"
  - keyword: "christians should be banned"
    severity: "high"
  - keyword: "hindus are inferior"
    severity: "high"
  - keyword: "buddhists are dangerous"
    severity: "high"
  - keyword: "sikhs are terrorists"
    severity: "high"
  - keyword: "atheists are evil"
    severity: "high"
  - keyword: "atheists have no morals"
    severity: "high"
  - keyword: "religious extremist"
    severity: "medium"
  - keyword: "religious fanatic"
    severity: "medium"
  - keyword: "infidel"
    severity: "medium"
  - keyword: "infidels"
    severity: "medium"

