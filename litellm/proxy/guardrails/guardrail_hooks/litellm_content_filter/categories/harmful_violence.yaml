# Violence and criminal planning content detection
# Uses conditional logic: BLOCK if an identifier word + block word appear in same sentence
category_name: "harmful_violence"
description: "Detects content related to violence, criminal planning, and attacks using identifier + block word combinations"
default_action: "BLOCK"

# IDENTIFIER WORDS - Violence-related terms (never blocked alone)
identifier_words:
  - "murder"
  - "kill"
  - "killing"
  - "assassin"
  - "assassination"
  - "hitman"
  - "kidnap"
  - "kidnapping"
  - "attack"
  - "violence"
  - "weapon"
  - "shooting"
  - "terrorist"
  - "terrorism"
  - "crime"
  - "serial killer"
  - "serial killers"
  - "mass shooter"
  - "mass shooting"
  - "school shooter"
  - "rape"
  - "sexual assault"
  - "torture"
  - "massacre"
  - "genocide"

# ADDITIONAL BLOCK WORDS - Harmful intent framing that triggers when combined with identifier words
additional_block_words:
  # Planning / intent
  - "how to"
  - "how do i"
  - "how can i"
  - "plan"
  - "planning"
  - "planned"
  - "organize"
  - "organizing"
  - "organized"
  - "coordinate"
  - "coordinating"
  - "commit"
  - "committing"
  - "execute"
  - "executing"
  - "carry out"
  - "get away with"
  - "step by step"
  - "instructions for"
  - "guide to"
  - "tips for"
  - "ways to"
  - "best way to"
  - "easiest way to"

  # Hiring / sourcing
  - "hire"
  - "find"
  - "locate"
  - "buy"
  - "purchase"
  - "order"
  - "contract"

  # Targeting
  - "my wife"
  - "my husband"
  - "my ex"
  - "my boss"
  - "my neighbor"
  - "someone"
  - "a person"
  - "a child"
  - "children"
  - "at school"
  - "in public"
  - "at work"

  # Escalation framing
  - "spree"
  - "rampage"
  - "without getting caught"
  - "without being caught"
  - "undetected"
  - "untraceable"

# ALWAYS BLOCK - Explicit dangerous phrases regardless of context
always_block_keywords:
  - keyword: "how to kill someone"
    severity: "high"
  - keyword: "how to kill"
    severity: "high"
  - keyword: "ways to kill"
    severity: "high"
  - keyword: "best way to kill"
    severity: "high"
  - keyword: "easiest way to kill"
    severity: "high"
