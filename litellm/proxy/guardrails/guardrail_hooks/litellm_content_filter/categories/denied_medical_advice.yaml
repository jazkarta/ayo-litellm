# Medical advice and diagnosis detection
# Uses conditional logic: BLOCK if an identifier word + block word appear in same sentence
category_name: "denied_medical_advice"
description: "Detects requests for medical advice, diagnosis, or treatment recommendations using identifier + block word combinations"
default_action: "BLOCK"

# IDENTIFIER WORDS - Medical terms (never blocked alone)
identifier_words:
  - "depression"
  - "anxiety"
  - "adhd"
  - "bipolar"
  - "drug"
  - "drugs"
  - "medication"
  - "medicine"
  - "prescription"
  - "doctor"
  - "physician"
  - "diagnosis"
  - "diagnose"
  - "symptoms"
  - "symptom"
  - "disease"
  - "illness"
  - "condition"
  - "cancer"
  - "diabetes"
  - "psychiatric"
  - "vaccine"
  - "vaccination"
  - "dosage"
  - "dose"
  - "injury"
  - "surgery"
  - "treatment"
  - "injection"

# ADDITIONAL BLOCK WORDS - Harmful request framing that triggers when combined with identifier words
additional_block_words:
  # Diagnosis requests
  - "diagnose me"
  - "do i have"
  - "tell me if i have"
  - "what do i have"
  - "am i sick"
  - "is it serious"
  - "what is wrong with me"

  # Prescription / treatment requests
  - "prescribe"
  - "prescribe me"
  - "what should i take"
  - "what can i take"
  - "recommend medication"
  - "recommend medicine"
  - "recommend treatment"
  - "what medication should"
  - "what medicine should"
  - "which medication"
  - "which medicine"
  - "what drug should"
  - "what drugs should"
  - "give me a prescription"
  - "write me a prescription"
  - "get a prescription"

  # Self-treatment requests
  - "treat myself"
  - "treat my own"
  - "cure myself"
  - "cure my own"
  - "how to treat"
  - "how to cure"
  - "how to fix"
  - "how much should i take"
  - "how many should i take"
  - "correct dose"
  - "right dose"
  - "safe dose"

  # Drug misuse framing
  - "get high"
  - "get high on"
  - "abuse"
  - "overdose on"
  - "how to overdose"
  - "mix with alcohol"
  - "without prescription"
  - "without a prescription"
  - "without seeing a doctor"
  - "instead of a doctor"
  - "instead of seeing"
  - "buy illegally"
  - "buy without"
  - "order without"

# ALWAYS BLOCK - Explicit dangerous requests
always_block_keywords:
  - keyword: "buy drugs online"
    severity: "high"
  - keyword: "get prescription without doctor"
    severity: "high"
  - keyword: "how to overdose"
    severity: "high"
  - keyword: "how much to overdose"
    severity: "high"
  - keyword: "lethal dose"
    severity: "high"
  - keyword: "fatal dose"
    severity: "high"
  - keyword: "how to get high on"
    severity: "high"
  - keyword: "mix drugs with"
    severity: "high"
  - keyword: "take drugs without"
    severity: "high"
  - keyword: "self diagnose"
    severity: "medium"
  - keyword: "self-diagnose"
    severity: "medium"
  - keyword: "diagnose myself"
    severity: "medium"

# Exceptions - legitimate discussions
exceptions:
  - "medical history"
  - "medical research"
  - "medical studies"
  - "according to research"
  - "research shows"
  - "studies show"
  - "consult a doctor"
  - "consult your doctor"
  - "see a doctor"
  - "see your doctor"
  - "talk to your doctor"
  - "speak with your doctor"
  - "ask your doctor"
  - "visit your doctor"
  - "medical professional"
  - "healthcare provider"
  - "healthcare professional"
  - "seek medical attention"
  - "seek medical advice"
  - "emergency medical"
  - "call emergency"
  - "call 911"
  - "go to hospital"
  - "medical emergency"
  - "general information"
  - "educational purposes"
  - "not medical advice"
  - "not a substitute for"
  - "medical terminology"
  - "medical science"
  - "public health"
  - "health education"
  - "wellness information"
  - "mental health awareness"
  - "what is"
  - "what are"
  - "how does"
  - "explain"
  - "definition of"
  - "cancer research"
  - "diabetes research"
  - "I think I have"
  - "I feel like I have"
  - "I've been feeling"
  - "I might have"
  - "I think I'm"
  - "I feel really"
