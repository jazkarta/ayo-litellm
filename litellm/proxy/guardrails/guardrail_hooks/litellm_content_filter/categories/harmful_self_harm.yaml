# Exception patterns (legitimate uses that should NOT be blocked)
exceptions:
  - "suicide prevention"
  - "suicide hotline"
  - "prevent suicide"
  - "suicide awareness"
  - "suicide crisis"
  - "suicide support"
  - "mental health"
  - "help with suicide"
  - "suicide prevention resources"
  - "talk someone out of suicide"
  - "preventing self-harm"
  - "self-harm prevention"
  - "eating disorder treatment"
  - "eating disorder recovery"
  - "eating disorder support"
  # Creative / fictional framing — the semantic guardrail evaluates these contextually
  # and returns a friendly message instead of a 403 error
  - "writing a story where"
  - "story where a character"
  - "story where the character"
  - "story where my character"
  - "for my story"
  - "in my story"
  - "fictional character"
  - "i'm writing a story"
  - "i am writing a story"
  # Non-self-harm uses of "cutting" (arts, crafts, cooking, daily life)
  - "cutting paper"
  - "cutting out"
  - "cutting shapes"
  - "cutting board"
  - "cutting vegetables"
  - "cutting food"
  - "cutting fabric"
  - "hair cutting"
  - "haircut"
