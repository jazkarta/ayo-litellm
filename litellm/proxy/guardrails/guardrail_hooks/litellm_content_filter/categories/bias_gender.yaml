# Gender-based bias and discrimination detection
# Uses conditional logic: BLOCK if an identifier word + block word appear in same sentence
category_name: "bias_gender"
description: "Detects gender-based discriminatory language, stereotypes, and biased content using identifier + block word combinations"
default_action: "BLOCK"

# IDENTIFIER WORDS - Gender reference terms (never blocked alone)
identifier_words:
  - "women"
  - "woman"
  - "men"
  - "man"
  - "female"
  - "females"
  - "male"
  - "males"
  - "girl"
  - "girls"
  - "boy"
  - "boys"
  - "feminine"
  - "masculine"
  - "mother"
  - "mothers"
  - "father"
  - "fathers"

# ADDITIONAL BLOCK WORDS - Harmful framing that triggers when combined with identifier words
additional_block_words:
  # Inferiority / capability claims
  - "inferior"
  - "superior"
  - "less capable"
  - "less intelligent"
  - "not as smart"
  - "not as capable"
  - "not as strong"
  - "weaker"
  - "dumber"
  - "stupider"
  - "too emotional"
  - "too weak"
  - "can't lead"
  - "cannot lead"
  - "can't handle"
  - "cannot handle"
  - "not fit to lead"
  - "not fit for"
  - "not capable of"
  - "not smart enough"
  - "not strong enough"
  - "not good enough"
  - "not qualified"

  # Exclusion language
  - "don't belong"
  - "do not belong"
  - "shouldn't work"
  - "should not work"
  - "shouldn't vote"
  - "should not vote"
  - "should stay home"
  - "belong in the kitchen"
  - "belong at home"
  - "should be excluded"
  - "has no place"
  - "have no place"
  - "should be kept out"
  - "not welcome"
  - "get out"

  # Inferiority / dehumanizing
  - "subhuman"
  - "inferior being"
  - "lesser being"
  - "property"
  - "object"
  - "objects"
  - "possessions"

  # Control / violence framing
  - "should be controlled"
  - "need to be controlled"
  - "should be beaten"
  - "deserve to be beaten"
  - "deserve abuse"
  - "deserve violence"
  - "should be punished"
  - "need to be punished"
  - "put in their place"

  # Negative stereotypes
  - "lazy"
  - "manipulative"
  - "irrational"
  - "hysterical"
  - "unstable"
  - "untrustworthy"
  - "dangerous"
  - "criminal"
  - "criminals"

# ALWAYS BLOCK - Explicit misogynistic / sexist phrases
always_block_keywords:
  - keyword: "women are inferior"
    severity: "high"
  - keyword: "women are stupid"
    severity: "high"
  - keyword: "women are too emotional"
    severity: "high"
  - keyword: "women belong in the kitchen"
    severity: "high"
  - keyword: "women don't deserve"
    severity: "high"
  - keyword: "women shouldn't vote"
    severity: "high"
  - keyword: "women can't lead"
    severity: "high"
  - keyword: "women are property"
    severity: "high"
  - keyword: "women are objects"
    severity: "high"
  - keyword: "men are superior"
    severity: "high"
  - keyword: "men are better than women"
    severity: "high"
  - keyword: "females are inferior"
    severity: "high"
  - keyword: "female president is bad"
    severity: "high"
  - keyword: "girls can't do math"
    severity: "high"
  - keyword: "girls are bad at"
    severity: "high"
  - keyword: "boys are better than girls"
    severity: "high"
  - keyword: "send her back to the kitchen"
    severity: "high"
  - keyword: "make her a sandwich"
    severity: "high"
  - keyword: "feminazi"
    severity: "high"
  - keyword: "feminazis"
    severity: "high"
  - keyword: "female privilege"
    severity: "high"
  - keyword: "male privilege doesn't exist"
    severity: "high"
  - keyword: "go back to the kitchen"
    severity: "high"
  - keyword: "women are too weak"
    severity: "high"
  - keyword: "women are not fit"
    severity: "high"
  - keyword: "women ruin"
    severity: "high"

# Exceptions - legitimate discussions about gender
exceptions:
  - "gender equality"
  - "gender diversity"
  - "gender studies"
  - "gender gap"
  - "gender discrimination"
  - "combat gender"
  - "address gender"
  - "research shows"
  - "study found"
  - "studies show"
  - "research indicates"
  - "gender identity"
  - "gender expression"
  - "transgender"
  - "gender neutral"
  - "women's rights"
  - "women's health"
  - "men's health"
  - "gender bias"
  - "gender equity"
  - "women's suffrage"
  - "women's history"
  - "women in leadership"
  - "support women"
  - "empower women"
  - "protect women"
  - "women's education"
  - "equal pay"
  - "pay gap"
  - "fight discrimination"
  - "against discrimination"
  - "historical"
  - "history of"
  - "learn about"
  - "education about"
  - "awareness"
  - "celebrate"
  - "men's rights"
  - "boys education"
  - "girls education"
  - "human rights"
